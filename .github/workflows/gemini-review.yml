# Gemini only answers when someone trusted comments "/gemini …" on a pull request. It no longer reviews PRs on its own,
# to save its quota (Oct 2026). To bring back automatic reviews, add the pull_request trigger back (see git history).
#   /gemini re-review        → a fresh full review of the current diff
#   /gemini <anything else>  → a reply in the conversation
# Needs the repository secret GEMINI_API_KEY: a Gemini API key from https://aistudio.google.com/apikey
# (usually starts with "AIza"). A Jules API key is a different thing and won't work. Without a key, this does nothing.
# Optional repository variables: GEMINI_MODEL (pin a model), GEMINI_TRUSTED (extra logins allowed to use /gemini).
name: gemini-review
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: gemini-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  gemini:
    if: >
      github.event_name == 'issue_comment' && github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/gemini')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # the reviewer script always comes from main, never from the pull request being reviewed
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Ask Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_TRUSTED: ${{ vars.GEMINI_TRUSTED }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/gemini-review.mjs
