# Gemini reviews Claude's pull requests, and answers on any PR when someone trusted comments "/gemini …".
#   /gemini re-review        → a fresh full review of the current diff
#   /gemini <anything else>  → a reply in the conversation
# Needs the repository secret GEMINI_API_KEY (from Google AI Studio). Without it, this does nothing.
# Optional repository variables: GEMINI_MODEL (pin a model), GEMINI_TRUSTED (extra logins allowed to use /gemini).
name: gemini-review
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: gemini-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false
jobs:
  gemini:
    if: >
      (github.event_name == 'pull_request' && !github.event.pull_request.draft
        && !contains(github.event.pull_request.user.login, 'jules')
        && !contains(github.event.pull_request.labels.*.name, 'no-gemini'))
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request
        && startsWith(github.event.comment.body, '/gemini'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # the reviewer script always comes from main, never from the pull request being reviewed
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Ask Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_TRUSTED: ${{ vars.GEMINI_TRUSTED }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/gemini-review.mjs
